[project]
name = "kirana-agent-backend"
version = "0.1.0"
description = "Bounded-autonomy discount agent for offline kirana retail"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "supabase==2.31.0",
    "razorpay==2.0.1",
    "segno==1.6.6",
    "jinja2>=3.1",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "structlog>=24.4",
    "asyncpg>=0.31.0",
    # Excel import for the merchant catalog. openpyxl rather than pandas:
    # pandas pulls numpy and ~50MB into a container that otherwise builds
    # in seconds, to read a six-row spreadsheet.
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    # Ed25519 for signing machine quotes. Already present transitively
    # via supabase, but declared because we import it directly and a
    # transitive dependency can disappear in a lockfile refresh.
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "hypothesis>=6.112",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: touches a real Supabase project (deselect with -m 'not integration')"]
testpaths = ["tests"]

[tool.uv]
package = false
